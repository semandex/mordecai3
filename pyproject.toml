[build-system]
requires = ["setuptools>=70.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mordecai3"
version = "3.0.0a.15"
description = "Geoparsing, NLP, and toponym resolution"
authors = [
    {name = "Andy Halterman", email = "ahalterman0@gmail.com"}
]
license = {text = "MIT"}
keywords = ["geoparsing", "nlp", "geocoding", "toponym resolution"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "typer>=0.16.0",
    "spacy-transformers>=1.3.9",
    "transformers>=4.49.0",
    "spacy>=3.8.7",
    "torch>=2.7.1",
    "scikit-learn>=1.7.1",
    "pandas>=1.2.2",
    "jellyfish>=1.2.0",
    "tqdm>=4.67.1",
    "numpy>=1.26.4",
    "jsonlines>=3.0.0",
    "xmltodict>=0.14.2",
    "opensearch-py>=3.0.0",
    "textacy>=0.13.0",
    "geojson-pydantic"
]

[tool.setuptools]
packages = ["mordecai3"]
include-package-data = true

[tool.setuptools.package-data]
mordecai3 = ["assets/*"]